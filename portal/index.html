<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>スタッフ用メニュー | Mitsume Coffee</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
  // 直URLをLINEアプリ内で開いた可能性が高い場合、最初からロゴ画面を出しておく。
  // （LIFF起動時は liff.state 等がURLに付くので、その場合は出さない）
  (function(){
    var isLine = /Line\//i.test(navigator.userAgent);
    var hasState = /[?&](liff\.state|code|state)=/.test(location.search);
    var retried = /[?&]retry=1/.test(location.search);
    if (isLine && !hasState && !retried) {
      document.documentElement.classList.add('splash-on');
      window.__splashAt = Date.now();
    }
  })();
</script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Hiragino Kaku Gothic ProN", sans-serif; background: #faf7f1; color: #333; }
  .brand { background: #fff; padding: 8px 16px 6px; }
  .brand img { height: 42px; display: block; margin: 0 auto; }
  header { background: #0A5A0B; color: #fff; padding: 14px 16px; }
  header h1 { margin: 0; font-size: 19px; }
  header .sub { font-size: 12px; opacity: .9; margin-top: 4px; }
  main { padding: 16px; max-width: 640px; margin: 0 auto; }
  a.menu-btn { display: block; text-decoration: none; border-radius: 14px; padding: 18px; margin-bottom: 12px; color: #fff; }
  a.menu-btn .t { display: block; font-size: 18px; font-weight: 700; }
  a.menu-btn .d { display: block; font-size: 13px; opacity: .92; margin-top: 4px; }
  a.menu-btn.green { background: #0A5A0B; }
  a.menu-btn.olive { background: #836312; }
  a.menu-btn.blue { background: #2b6cb0; }
  a.menu-btn.slate { background: #595959; }
  a.menu-btn.wine { background: #6b2237; }
  a.menu-btn.disabled { background: #c9c9c4; color: #8a8a84; pointer-events: none; }
  a.menu-btn.disabled .d { opacity: .8; }
  .note { font-size: 12px; color: #8a8578; text-align: center; margin-top: 20px; line-height: 1.7; } 
    .copy { font-size: 11px; color: #b3aea0; text-align: center; margin: 18px 0 10px; }
  .spinner { display: inline-block; width: 12px; height: 12px; border: 2px solid #d8d8ce; border-top-color: #8a8a84; border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -2px; margin-right: 5px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #splash { display: none; position: fixed; inset: 0; background: #fff; z-index: 999; align-items: center; justify-content: center; }
  html.splash-on #splash { display: flex; }
  #splash img { width: 340px; max-width: 86vw; }
  @keyframes splashIn { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: scale(1); } }
</style>
</head>
<body>
<div id="splash"><img src="giorno-logo.gif" alt="Giorno"></div>
<div class="brand"><img src="Logo三ツ目2nd完成透過.png" alt="三ツ目珈琲"></div>
<header>
  <h1>スタッフ用メニュー</h1>
  <div class="sub" id="greeting">Mitsume Coffee</div>
</header>
<main>
  <a class="menu-btn blue" href="https://liff.line.me/2012734423-JWdExkSG">
    <span class="t">タイムカード</span>
    <span class="d">出社・退社の打刻（店の近くでのみ押せます）</span>
  </a>
  <a class="menu-btn olive" href="https://liff.line.me/2012734423-dIDvKWqD">
    <span class="t">壊れ物報告</span>
    <span class="d">店の物が壊れたら、ここから報告してください</span>
  </a>
  <a class="menu-btn green" href="https://liff.line.me/2012734423-wNqztLhN">
    <span class="t">シフト提出</span>
    <span class="d">来月のシフト希望を出す・直す</span>
  </a>
  <a class="menu-btn slate" href="https://liff.line.me/2012734423-APRgg27M">
    <span class="t">シフト照会</span>
    <span class="d">確定したシフトを見る・カレンダーに入れる</span>
  </a>
  <a class="menu-btn wine disabled" id="adminBtn" href="https://liff.line.me/2012734423-NsDIKn5t">
    <span class="t">管理画面</span>
    <span class="d" id="adminBtnDesc"><span class="spinner"></span>店主・管理者用（確認中…）</span>
  </a>
  <p class="note">このページはグループの固定メッセージから開けます。<br>アプリが増えたらここにボタンが増えます。</p>
    <p class="copy">© 2026 Giorno LLC</p>
</main>
<script>
  // 開いた人の名前（LINEプロフィール）であいさつを表示する。
  // 管理ボタンは、開いた人が管理者（従業員マスターのロール=admin）のときだけ有効になる。
  // 判定は管理API（サーバ側）で行い、失敗・対象外ならグレイアウトのまま。
  const PORTAL_LIFF_ID = '2012734423-1btygsyk';
  const ADMIN_API_URL = 'https://script.google.com/macros/s/AKfycbxOrvoupXydB5FA3B2M3gOLZmZRtF8wQFVMdrNEZRzue3EgJnCMppdJUyXIqJGnCxfx/exec';

  function callCheckAdmin(idToken){
    return new Promise(function(resolve){
      const cb = 'cb_' + Math.random().toString(36).slice(2);
      const url = ADMIN_API_URL + '?api=1&action=checkAdmin&callback=' + cb + '&idToken=' + encodeURIComponent(idToken);
      const timer = setTimeout(function(){ cleanup(); resolve(null); }, 15000);
      function cleanup(){ delete window[cb]; if (s.parentNode) s.parentNode.removeChild(s); }
      window[cb] = function(res){ clearTimeout(timer); cleanup(); resolve(res && res.ok ? res.data : null); };
      const s = document.createElement('script');
      s.src = url;
      s.onerror = function(){ clearTimeout(timer); cleanup(); resolve(null); };
      document.body.appendChild(s);
    });
  }

  function greetingWord(){
    const h = new Date().getHours();
    if (h >= 5 && h < 11) return 'おはよー';
    if (h >= 11 && h < 17) return 'こんにちは';
    return 'こんばんは';
  }

  (async function(){
    const btn = document.getElementById('adminBtn');
    const desc = document.getElementById('adminBtnDesc');
    const greet = document.getElementById('greeting');
    let loggedIn = false;
    try {
      await liff.init({ liffId: PORTAL_LIFF_ID });
      loggedIn = liff.isLoggedIn();
    } catch (e) { loggedIn = false; }
    if (!loggedIn) {
      // LIFFリンクから開かれていない（グループに貼ったURLを直接開いた等）と
      // 本人確認ができず、あいさつも管理ボタンも効かない。
      // LINEアプリ内で開かれているなら、ロゴ画面を少し見せてから
      // LIFFリンクへ自動で寄せる（1回だけ）。
      const inLineApp = /Line\//i.test(navigator.userAgent);
      if (inLineApp && !/[?&]retry=1/.test(location.search)) {
        document.documentElement.classList.add('splash-on');
        const shownAt = window.__splashAt || Date.now();
        const wait = Math.max(0, 5000 - (Date.now() - shownAt));
        setTimeout(function(){
          location.replace('https://liff.line.me/' + PORTAL_LIFF_ID + '?retry=1');
        }, wait);
        return;
      }
      document.documentElement.classList.remove('splash-on');
      desc.textContent = '店主・管理者用'; return;
    }
    document.documentElement.classList.remove('splash-on');
    try {
      const idToken = liff.getIDToken() || '';
      // 名前取得と管理者判定は同時に走らせる（判定を名前待ちで遅らせない）
      const profileP = liff.getProfile().catch(function(){ return null; });
      const adminP = idToken ? callCheckAdmin(idToken) : Promise.resolve(null);
      const profile = await profileP;
      if (profile && profile.displayName) {
        greet.textContent = profile.displayName + 'さん、' + greetingWord() + '。';
      }
      if (!idToken) { desc.textContent = '店主・管理者用'; return; }
      const data = await adminP;
      if (data && data.admin) {
        btn.classList.remove('disabled');
        desc.textContent = '店主・管理者用（従業員マスター・期間・店舗設定）';
      } else {
        desc.textContent = '店主・管理者用';
      }
    } catch (e) {
      desc.textContent = '店主・管理者用';
    }
  })();
</script>
</body>
</html>
