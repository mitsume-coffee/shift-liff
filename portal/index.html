<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>スタッフ用メニュー | Mitsume Coffee</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Hiragino Kaku Gothic ProN", sans-serif; background: #faf7f1; color: #333; }
  .brand { background: #fff; padding: 8px 16px 6px; }
  .brand img { height: 42px; display: block; margin: 0 auto; }
  header { background: #0A5A0B; color: #fff; padding: 14px 16px; }
  header h1 { margin: 0; font-size: 19px; }
  header .sub { font-size: 12px; opacity: .9; margin-top: 4px; }
  main { padding: 16px; max-width: 640px; margin: 0 auto; }
  a.menu-btn { display: block; text-decoration: none; border-radius: 14px; padding: 18px; margin-bottom: 12px; color: #fff; }
  a.menu-btn .t { display: block; font-size: 18px; font-weight: 700; }
  a.menu-btn .d { display: block; font-size: 13px; opacity: .92; margin-top: 4px; }
  a.menu-btn.green { background: #0A5A0B; }
  a.menu-btn.olive { background: #836312; }
  .note { font-size: 12px; color: #8a8578; text-align: center; margin-top: 20px; line-height: 1.7; }
</style>
</head>
<body>
<div class="brand"><img src="Logo三ツ目2nd完成透過.png" alt="三ツ目珈琲"></div>
<header>
  <h1>スタッフ用メニュー</h1>
  <div class="sub">Mitsume Coffee</div>
</header>
<main>
  <a class="menu-btn green" href="https://liff.line.me/2012734423-wNqztLhN">
    <span class="t">シフト提出</span>
    <span class="d">来月のシフト希望を出す・直す</span>
  </a>
  <a class="menu-btn olive" href="https://liff.line.me/2012734423-dIDvKWqD">
    <span class="t">壊れ物報告</span>
    <span class="d">店の物が壊れたら、ここから報告してください</span>
  </a>
  <p class="note">このページはグループの固定メッセージから開けます。<br>アプリが増えたらここにボタンが増えます。</p>
</main>
</body>
</html>
