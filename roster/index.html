<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>シフト照会 | Mitsume Coffee</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  body { margin: 0; font-family: -apple-system, "Hiragino Kaku Gothic ProN", sans-serif; background: #fbf9f1; color: #33302a; }
  header { position: sticky; top: 0; z-index: 10; box-shadow: 0 1px 6px rgba(0,0,0,.18); }
  .brandbar { background: #fff; padding: 8px 16px 6px; }
  .brandbar .logo { height: 42px; display: block; margin: 0 auto; }
  .titlebar { background: #0A5A0B; color: #fff; padding: 10px 16px 12px; }
  .titlerow { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  header h1 { font-size: 19px; margin: 0; }
  header .who { font-size: 12.5px; white-space: nowrap; }
  .navbar { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .navbtn { flex: 0 0 auto; width: 44px; height: 36px; border: none; border-radius: 999px; background: rgba(255,255,255,.22); color: #fff; font-size: 15px; font-weight: 700; }
  .navbtn:disabled { opacity: .3; }
  .navbtn:active { opacity: .75; }
  .period { flex: 1; text-align: center; font-size: 15px; font-weight: 700; }
  main { padding: 14px 14px 40px; max-width: 860px; margin: 0 auto; }
  table { border-collapse: collapse; width: 100%; background: #fff; font-size: 11.5px; }
  th, td { border: 1px solid #b9b2a4; padding: 4px 3px; text-align: center; white-space: nowrap; }
  th { background: #595959; color: #fff; }
  td.d, td.w { font-weight: 700; }
  tr.r-sun { background: #f9dee0; } tr.r-sat { background: #dbe7f5; } tr.r-closed { background: #e3e1db; color: #999; }
  td.me, th.me { background: #fff3a6; }
  .btn { display: block; width: 100%; box-sizing: border-box; border: none; border-radius: 999px; padding: 13px; font-size: 15px; font-weight: 700; background: #0A5A0B; color: #fff; margin-top: 14px; }
  .btn:active { opacity: .85; }
  .btn.sub { background: #595959; margin: 0 0 10px; padding: 10px; font-size: 13.5px; }
  .note { font-size: 12px; color: #8a8578; line-height: 1.7; margin-top: 10px; }
  #status { padding: 30px 0; text-align: center; color: #8a8578; font-size: 14px; }
  .scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  @media (orientation: landscape) {
    main { max-width: 100%; padding: 10px 12px 32px; }
    table { font-size: 12.5px; }
    .brandbar .logo { height: 34px; }
    .titlebar { padding: 8px 16px 10px; }
  }
</style>
</head>
<body>
<header>
  <div class="brandbar"><a href="https://mitsume-coffee.github.io/shift-liff/portal/"><img class="logo" src="../Logo三ツ目2nd完成透過.png" alt="三ツ目珈琲"></a></div>
  <div class="titlebar">
    <div class="titlerow"><h1>シフト照会</h1><div class="who" id="who"></div></div>
    <div class="navbar">
      <button class="navbtn" id="prevBtn" disabled>◀</button>
      <div class="period" id="periodLabel">読み込み中…</div>
      <button class="navbtn" id="nextBtn" disabled>▶</button>
    </div>
  </div>
</header>
<main>
  <div id="status">読み込み中…</div>
  <div id="content" style="display:none">
    <button class="btn sub" id="viewToggle">自分だけ表示</button>
    <div class="scroll"><table id="all"></table></div>
    <button class="btn" id="icsBtn">自分のシフトをカレンダーに追加（.ics）</button>
    <div class="note">ボタンを押すと外部ブラウザが開きます。そちらでダウンロードし、ファイル（shift.ics）を開くと、カレンダーに自分のシフトがまとめて入ります。</div>
  </div>
</main>
<script>
  var LIFF_ID = '2012734423-APRgg27M';
  var API_URL = 'https://script.google.com/macros/s/AKfycbzTxGUDPTMolQJ1IA4zhnUDvGxKIcROgPqXP9WjBGQwVHLkoJEe0nP3L6sTW0SSHD4y/exec';
  var cbSeq = 0;
  var roster = null;
  var onlyMe = false;
  var currentKey = '';
  var idToken = '';
  var displayName = '';

  function jsonp(action, params) {
    return new Promise(function (resolve, reject) {
      var cb = 'jsonpCb' + (++cbSeq) + '_' + Date.now();
      var script = document.createElement('script');
      var timer = setTimeout(function () { cleanup(); reject(new Error('通信がタイムアウトしました')); }, 20000);
      function cleanup() { clearTimeout(timer); delete window[cb]; script.remove(); }
      window[cb] = function (res) { cleanup(); resolve(res); };
      script.onerror = function () { cleanup(); reject(new Error('通信に失敗しました')); };
      var qs = ['api=1', 'action=' + encodeURIComponent(action), 'callback=' + cb];
      for (var k in params) qs.push(k + '=' + encodeURIComponent(params[k]));
      script.src = API_URL + '?' + qs.join('&');
      document.body.appendChild(script);
    });
  }

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  function showNoAccess() {
    document.body.innerHTML =
      '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;background:#f7f7f2;">' +
      '<div style="text-align:center;max-width:340px;">' +
      '<div style="font-size:19px;font-weight:700;color:#0A5A0B;margin-bottom:14px;">アクセス権がありません</div>' +
      '<div style="font-size:15px;line-height:1.8;color:#333;">管理者に設定をしてもらってください。</div>' +
      '</div></div>';
  }

  async function main() {
    var status = document.getElementById('status');
    window.addEventListener('error', function (e) {
      status.textContent = 'エラー：' + (e.message || '不明なエラー');
    });
    try {
      document.getElementById('periodLabel').textContent = '初期化中…';
      await liff.init({ liffId: LIFF_ID });
      if (!liff.isLoggedIn()) { document.getElementById('periodLabel').textContent = 'LINEログインへ移動します…'; liff.login(); return; }
      idToken = liff.getIDToken();
      try { var profile = await liff.getProfile(); displayName = profile ? profile.displayName : ''; } catch (e) { }
      await load('');
      status.style.display = 'none';
      document.getElementById('content').style.display = 'block';
    } catch (e) {
      if (e && e.message === 'NO_ACCESS') { showNoAccess(); return; }
      status.textContent = '読み込めませんでした：' + (e.message || e);
      document.getElementById('periodLabel').textContent = '読み込みエラー';
    }
  }

  async function load(key) {
    document.getElementById('periodLabel').textContent = 'データ取得中…';
    var res = await jsonp('getRoster', { idToken: idToken, name: displayName, period: key || '' });
    if (!res.ok) throw new Error(res.error || '取得に失敗しました');
    roster = res.data;
    currentKey = roster.periodKey;
    render();
  }

  function neighborKey(dir) {
    if (!roster || !roster.periods) return '';
    var idx = -1;
    for (var i = 0; i < roster.periods.length; i++) {
      if (roster.periods[i].key === currentKey) { idx = i; break; }
    }
    var n = idx + dir;
    if (idx < 0 || n < 0 || n >= roster.periods.length) return '';
    return roster.periods[n].key;
  }

  function render() {
    var d = roster;
    document.getElementById('who').textContent = d.me ? d.me + ' さんのシフト' : '';
    document.getElementById('periodLabel').textContent = d.label;
    document.getElementById('prevBtn').disabled = !neighborKey(-1);
    document.getElementById('nextBtn').disabled = !neighborKey(1);
    // カレンダー追加ボタンは、自分のシフトがある時だけ出す
    var myDays = d.me ? d.rows.filter(function (r) { return r.cells[d.me]; }) : [];
    document.getElementById('icsBtn').style.display = myDays.length ? 'block' : 'none';
    // 全体表（自分だけ表示の切替つき）
    var cols = (onlyMe && d.me) ? [d.me] : d.columns;
    document.getElementById('viewToggle').style.display = d.me ? 'block' : 'none';
    document.getElementById('viewToggle').textContent = onlyMe ? '全員表示' : '自分だけ表示';
    var t = '<tr><th>日</th><th>曜</th>' + cols.map(function (c) {
      return '<th' + (c === d.me ? ' class="me"' : '') + '>' + esc(c) + '</th>';
    }).join('') + '</tr>';
    t += d.rows.map(function (r) {
      var has = cols.some(function (c) { return r.cells[c]; });
      var cls = !has ? 'r-closed' : (r.wd === '日' ? 'r-sun' : (r.wd === '土' ? 'r-sat' : ''));
      var cells = cols.map(function (c) {
        return '<td' + (c === d.me && r.cells[c] ? ' class="me"' : '') + '>' + esc(r.cells[c] || '') + '</td>';
      }).join('');
      return '<tr class="' + cls + '"><td class="d">' + esc(r.dayLabel) + '</td><td class="w">' + r.wd + '</td>' + cells + '</tr>';
    }).join('');
    document.getElementById('all').innerHTML = t;
  }

  document.getElementById('prevBtn').addEventListener('click', async function () {
    var k = neighborKey(-1);
    if (k) { try { await load(k); } catch (e) { alert('読み込めませんでした：' + (e.message || e)); } }
  });
  document.getElementById('nextBtn').addEventListener('click', async function () {
    var k = neighborKey(1);
    if (k) { try { await load(k); } catch (e) { alert('読み込めませんでした：' + (e.message || e)); } }
  });

  document.getElementById('viewToggle').addEventListener('click', function () {
    onlyMe = !onlyMe;
    if (roster) render();
  });

  var icsBusy = false;
  document.getElementById('icsBtn').addEventListener('click', async function () {
    // LINE内ブラウザではダウンロードが動かず、GASのページは端末のGoogleログイン状態で
    // 開けないことがあるため、ICSデータだけAPIで受け取り、GitHub Pages側の専用ページを
    // 外部ブラウザで開いてそちらでダウンロードさせる
    if (icsBusy) return;
    icsBusy = true;
    var btn = document.getElementById('icsBtn');
    var orig = btn.textContent;
    btn.textContent = '準備中…';
    try {
      var res = await jsonp('getIcs', { idToken: idToken, period: currentKey });
      if (!res.ok) throw new Error(res.error || '取得に失敗しました');
      var payload = JSON.stringify({ me: res.data.me, label: res.data.monthLabel, ics: res.data.ics });
      var url = new URL('ics.html', location.href).href + '#' + btoa(unescape(encodeURIComponent(payload)));
      if (liff.isInClient()) {
        liff.openWindow({ url: url, external: true });
      } else {
        window.open(url, '_blank');
      }
    } catch (e) {
      alert('カレンダー用データの取得に失敗しました：' + (e.message || e));
    }
    btn.textContent = orig;
    icsBusy = false;
  });

  main();
</script>
</body>
</html>
