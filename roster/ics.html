<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>カレンダーに追加 | Mitsume Coffee</title>
<style>
  body { margin: 0; font-family: -apple-system, "Hiragino Kaku Gothic ProN", sans-serif; background: #fbf9f1; color: #33302a; }
  .brandbar { background: #fff; padding: 8px 16px 6px; box-shadow: 0 1px 6px rgba(0,0,0,.18); }
  .brandbar .logo { height: 42px; display: block; margin: 0 auto; }
  main { padding: 24px 18px 40px; max-width: 560px; margin: 0 auto; text-align: center; }
  h1 { font-size: 19px; color: #0A5A0B; }
  #desc { font-size: 15px; }
  .btn { display: block; width: 100%; box-sizing: border-box; border: none; border-radius: 999px; padding: 14px; font-size: 16px; font-weight: 700; background: #0A5A0B; color: #fff; margin-top: 18px; }
  .btn:active { opacity: .85; }
  .note { font-size: 12.5px; color: #8a8578; line-height: 1.8; margin-top: 14px; text-align: left; }
</style>
</head>
<body>
<div class="brandbar"><img class="logo" src="../Logo三ツ目2nd完成透過.png" alt="三ツ目珈琲"></div>
<main>
  <h1>カレンダーに追加</h1>
  <p id="desc">読み込み中…</p>
  <button class="btn" id="dl">ダウンロード</button>
  <p class="note">ダウンロードしたファイル（shift.ics）を開くと、カレンダーに自分のシフトがまとめて追加できます。自動でダウンロードが始まらない時は、上のボタンを押してください。</p>
</main>
<script>
  var data = null;
  try {
    data = JSON.parse(decodeURIComponent(escape(atob(location.hash.slice(1)))));
  } catch (e) { }
  var desc = document.getElementById('desc');
  var btn = document.getElementById('dl');
  function dl() {
    var b = new Blob([data.ics], { type: 'text/calendar' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(b);
    a.download = 'shift.ics';
    document.body.appendChild(a);
    a.click();
    a.remove();
  }
  if (!data || !data.ics) {
    desc.textContent = 'データが見つかりませんでした。シフト照会の画面から開き直してください。';
    btn.style.display = 'none';
  } else {
    desc.textContent = data.me + ' さんのシフト（' + data.label + '）';
    btn.addEventListener('click', dl);
    setTimeout(dl, 600);
  }
</script>
</body>
</html>
